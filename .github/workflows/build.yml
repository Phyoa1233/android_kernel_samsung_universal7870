name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev git bison flex gcc-aarch64-linux-gnu libncurses5-dev gcc-10 g++-10

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export HOSTCC=gcc-10
          export HOSTCXX=g++-10
          export CC=gcc-10
          
          # DTC ဖိုင်ဟောင်းများကို ရှင်းလင်းခြင်းဖြင့် yylloc error ကို ကျော်လွှားရန်
          make clean -C scripts/dtc
          
          # Exynos 7870 config ဖြင့် စမ်းသပ်ခြင်း
          make exynos7870-gtaxllte_defconfig
          
          # Kernel စတင်တည်ဆောက်ခြင်း
          make -j$(nproc)
