name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev git bison flex gcc-aarch64-linux-gnu libncurses5-dev

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export HOSTCFLAGS="-fcommon"
          export CFLAGS="-fcommon"
          
          # DTC compiler အတွက်ပါ -fcommon ထည့်ခြင်း
          make -C scripts/dtc HOSTCFLAGS="-fcommon" || true
          
          # Defconfig ဖြင့် Config တည်ဆောက်ခြင်း
          make exynos7870-gtaxllte_defconfig
          
          # Kernel စတင်တည်ဆောက်ခြင်း
          make -j$(nproc)
