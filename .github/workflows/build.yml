name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libssl-dev git bison flex gcc-aarch64-linux-gnu libncurses5-dev gcc-10 g++-10

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export HOSTCC=gcc-10
          export HOSTCXX=g++-10
          export CC=gcc-10
          
          # ၁။ Defconfig ကို ဦးစွာ အရင် Run ပါ (ဒါမှ .config ဖိုင် အရင်ထွက်လာပါမယ်)
          make exynos7870-gtaxllte_defconfig
          
          # ၂။ ထို့နောက် လိုအပ်သော scripts များကို တည်ဆောက်ပါ
          make scripts
          
          # ၃။ Kernel ကို အပြည့်အစုံ စတင် Build ပါ
          make -j$(nproc)
